workflows:
  android-workflow:
    name: ShopeePay Detector Android
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Generate Gradle Wrapper
        script: |
          gradle wrapper
          chmod +x gradlew

      - name: Build APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
